name: Bug report
description: Something Kata did that it should not have, or did not do that it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For security problems, do not file an issue. Follow SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what Kata did instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include `/kata review <id>` output if a proposal or kata is involved. Remove anything private.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `hermes --version` and the Kata version from `hermes plugins show kata`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, WSL, Other]
    validations:
      required: true
