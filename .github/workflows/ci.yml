name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff>=0.6,<1"
      - run: ruff check .
      - name: Validate manifests
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          import json, yaml
          m = yaml.safe_load(open("kata/plugin.yaml"))
          assert m["name"] == "kata" and m["version"], "plugin.yaml"
          d = json.load(open("kata/dashboard/manifest.json"))
          assert d["name"] == "kata" and d["version"] == m["version"], "dashboard version must match plugin version"
          c = yaml.safe_load(open("docs/catalog-entry.yaml"))
          assert c["name"] == "kata" and c["subdir"] == "kata", "catalog entry"
          print("manifests ok")
          PY

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "pytest>=8,<10" "pytest-cov>=5,<8" "fastapi>=0.110,<1" "httpx>=0.27,<1" "pyyaml>=6,<7"
      - name: Tests (no skips allowed)
        run: python -m pytest -rs --cov=kata --cov-report=term --cov-fail-under=85
      - name: End-to-end demo
        run: python scripts/demo.py
        env:
          PYTHONIOENCODING: utf-8
