[project]
name = "hermes-kata"
version = "0.1.0"
description = "Compile the routines your Hermes agent repeats into approved, deterministic tools."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "opeblow" }]
keywords = ["hermes-agent", "agents", "llm", "tool-use", "workflow", "plugin", "human-in-the-loop"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://opeblow.github.io/kata/"
Documentation = "https://opeblow.github.io/kata/docs.html"
Repository = "https://github.com/opeblow/kata"
Changelog = "https://github.com/opeblow/kata/blob/main/CHANGELOG.md"
Issues = "https://github.com/opeblow/kata/issues"
Demo = "https://youtu.be/nMTOGmmoCq8"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "pyyaml>=6,<7", "ruff>=0.6,<1", "fastapi>=0.110,<1", "httpx>=0.27,<1", "uvicorn>=0.29,<1", "playwright>=1.44,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP007"]
