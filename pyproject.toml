[project]
name = "hermes-kata"
version = "0.1.0"
description = "Compile the routines your Hermes agent repeats into approved, deterministic tools."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<7", "pyyaml>=6,<7", "ruff>=0.6,<1", "fastapi>=0.110,<1", "httpx>=0.27,<1", "uvicorn>=0.29,<1", "playwright>=1.44,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP007"]
